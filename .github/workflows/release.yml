# Builds, tests, signs and publishes Mezzanine when a version tag (v1.2.3) is pushed by
# Scripts/release.sh. "Run workflow" makes a test build (DMG as an artifact) without publishing,
# unless "publish" is ticked. Mac minutes are billed 10x on private repos, so nothing runs on
# ordinary pushes.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this build to mezzanine-releases
        type: boolean
        default: false

permissions:
  contents: write # the GitHub Release on this repo

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Already published?
        id: published
        if: github.ref_type == 'tag'
        run: |
          if git ls-remote --tags https://github.com/ahamedzoha/mezzanine-releases.git "refs/tags/$GITHUB_REF_NAME" | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_REF_NAME is already out (published from the Mac); nothing to do."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.published.outputs.skip != 'true'
        with:
          fetch-depth: 0 # the build number is the commit count

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.published.outputs.skip != 'true'
        with:
          path: build.noindex/ReleaseData/SourcePackages
          key: spm-${{ hashFiles('Mezzanine.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Signing identity
        if: steps.published.outputs.skip != 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: Scripts/ci/import-identity.sh

      - name: Core tests
        if: steps.published.outputs.skip != 'true'
        working-directory: MezzanineKit
        run: swift test 2>&1 | tail -n 25

      - name: Build, sign and package
        if: steps.published.outputs.skip != 'true'
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: |
          printf '%s' "$SPARKLE_ED_KEY" > "$RUNNER_TEMP/sparkle_ed_key"
          SPARKLE_KEY_FILE="$RUNNER_TEMP/sparkle_ed_key" VENV="$RUNNER_TEMP/venv" Scripts/build-release.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.published.outputs.skip != 'true'
        with:
          name: Mezzanine
          path: build.noindex/dist/
          retention-days: 30

      - name: Publish
        if: steps.published.outputs.skip != 'true' && (github.ref_type == 'tag' || inputs.publish)
        env:
          RELEASES_DEPLOY_KEY: ${{ secrets.RELEASES_DEPLOY_KEY }}
        run: Scripts/ci/publish.sh

      - name: GitHub Release
        if: steps.published.outputs.skip != 'true' && (github.ref_type == 'tag' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: Scripts/github-release.sh

      - name: Clean up
        if: always() && steps.published.outputs.skip != 'true'
        run: Scripts/ci/cleanup.sh
