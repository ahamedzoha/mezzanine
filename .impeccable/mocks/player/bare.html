<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Mezzanine · Player · Bare Picture</title>
<style>
:root{--graphite:#0E0F11;--ink:#F2F2F0;--ink2:rgba(242,242,240,.66);--lilac:#A08CFF;
--glass:rgba(0,0,0,.55);--glass-line:rgba(255,255,255,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:900px;overflow:hidden;background:#000}
body{position:relative;font:400 14px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",system-ui,"Helvetica Neue",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;cursor:default}
button{font:inherit;color:inherit;border:0;background:none;cursor:default}

/* The film: 2.39:1 picture, letterboxed in a 1440x900 window */
.picture{position:absolute;left:0;right:0;top:149px;height:602px;overflow:hidden;
background:
 radial-gradient(ellipse 260px 180px at 1010px 250px,rgba(255,190,110,.55),rgba(255,150,70,.18) 55%,transparent 75%),
 radial-gradient(ellipse 900px 420px at 1000px 300px,rgba(214,112,56,.28),transparent 70%),
 linear-gradient(180deg,#0b1419 0%,#16262d 38%,#3a4a4a 62%,#6b5440 74%,#1d1a16 75%,#0d0f0e 100%)}
.house{position:absolute;left:880px;top:190px;width:300px;height:230px;background:#0a0b0b;clip-path:polygon(0 38%,50% 0,100% 38%,100% 100%,0 100%)}
.win{position:absolute;left:944px;top:290px;width:74px;height:84px;background:linear-gradient(#ffd79a,#f0a050);box-shadow:0 0 90px 30px rgba(255,170,80,.4)}
.win2{left:1070px;width:56px;opacity:.55}
.hill{position:absolute;left:-100px;right:-100px;top:410px;height:260px;background:radial-gradient(ellipse 900px 120px at 40% 0,#10150f 60%,transparent 61%),#0a0d0b}
.fig{position:absolute;left:380px;top:330px;width:60px;height:150px;background:#050606;border-radius:30px 30px 6px 6px}
.fig::before{content:"";position:absolute;left:14px;top:-34px;width:32px;height:36px;border-radius:50%;background:#050606}
.mower{position:absolute;left:452px;top:440px;width:120px;height:46px;background:#070808;border-radius:8px 18px 4px 4px;transform:skewX(-8deg)}
.grain{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,.55) 100%)}

/* Glass: player controls only, tinted dark enough for bright frames */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(1.4);backdrop-filter:blur(28px) saturate(1.4);
border:1px solid var(--glass-line);box-shadow:0 6px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
.round{position:absolute;width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.round svg{width:16px;height:16px;stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round}

/* Top */
.title{position:absolute;left:40px;top:30px;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.title b{display:block;font-size:15px;font-weight:600;letter-spacing:.1px}
.title span{display:block;margin-top:3px;font-size:12px;color:var(--ink2);font-feature-settings:"tnum"}
.close{right:40px;top:26px}

/* Transient state indicator */
.pause{position:absolute;left:684px;top:414px;width:72px;height:72px;border-radius:50%;display:flex;gap:8px;align-items:center;justify-content:center}
.pause i{width:7px;height:24px;border-radius:2px;background:var(--ink)}

/* Skip Intro: the only full button */
.skip{position:absolute;right:96px;bottom:44px;height:40px;padding:0 20px 0 18px;border-radius:999px;background:var(--lilac);color:var(--graphite);
font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.4)}
.skip svg{width:13px;height:13px;fill:var(--graphite)}
.skip .stay{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(14,15,17,.2)}
.skip .stay i{display:block;height:100%;width:62%;background:var(--graphite);opacity:.75}
.more{right:40px;bottom:44px}
.more svg{width:18px;height:18px;fill:var(--ink);stroke:none}

/* Options popover, anchored above the more button */
.pop{position:absolute;right:40px;bottom:96px;width:340px;border-radius:16px;padding:6px;background:rgba(0,0,0,.72)}
.pop button{display:flex;width:100%;align-items:center;gap:12px;height:46px;padding:0 12px;border-radius:10px;text-align:left}
.pop button+button{margin-top:1px}
.pop .sel{background:rgba(255,255,255,.1)}
.pop .k{width:70px;font-weight:600;font-size:13px}
.pop .v{flex:1;font-size:13px;color:var(--ink2);font-feature-settings:"tnum";white-space:nowrap}
.pop svg{width:8px;height:12px;stroke:var(--ink2);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pop kbd{font:500 11px -apple-system,system-ui,sans-serif;color:var(--ink2);margin-right:2px}

/* Scrub: 2 pt hairline at the very bottom edge */
.times{position:absolute;left:40px;right:40px;bottom:12px;display:flex;justify-content:space-between;font:500 12px/1 -apple-system,"SF Pro Text",system-ui,sans-serif;font-feature-settings:"tnum";font-variant-numeric:tabular-nums;color:var(--ink);text-shadow:0 1px 6px rgba(0,0,0,.8)}
.times span:last-child{color:var(--ink2)}
.scrub{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(242,242,240,.3)}
.scrub i{position:absolute;top:0;bottom:0}
.scrub .intro{left:3%;width:5.7%;background:rgba(242,242,240,.6)}
.scrub .credits{left:94.3%;right:0;background:rgba(242,242,240,.6)}
.scrub .played{left:0;width:5.45%;background:var(--ink);z-index:2}
</style></head>
<body>
<div class="picture">
  <div class="house"></div><div class="win"></div><div class="win win2"></div>
  <div class="hill"></div><div class="fig"></div><div class="mower"></div>
  <div class="grain"></div>
</div>

<div class="title"><b>Bojack Horseman</b><span>S2 · E3 · Lawnmower Dog</span></div>
<button class="round glass close" aria-label="Close"><svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13"/></svg></button>

<div class="pause glass" aria-label="Paused"><i></i><i></i></div>

<div class="pop glass" role="menu">
  <button><span class="k">Audio</span><span class="v">English · E-AC-3 5.1</span><svg viewBox="0 0 8 12"><path d="M1.5 1l5 5-5 5"/></svg></button>
  <button><span class="k">Subtitles</span><span class="v">English (SRT)</span><svg viewBox="0 0 8 12"><path d="M1.5 1l5 5-5 5"/></svg></button>
  <button class="sel"><span class="k">Sound</span><span class="v">150 % · Dialogue +3 dB</span><svg viewBox="0 0 8 12"><path d="M1.5 1l5 5-5 5"/></svg></button>
  <button><span class="k">Speed</span><span class="v">1×</span><svg viewBox="0 0 8 12"><path d="M1.5 1l5 5-5 5"/></svg></button>
</div>

<button class="skip">Skip Intro<svg viewBox="0 0 13 13"><path d="M1 1.5v10l7-5zM8 1.5v10l5-5z"/></svg><span class="stay"><i></i></span></button>
<button class="round glass more" aria-label="Audio, subtitles, sound, speed"><svg viewBox="0 0 18 18"><circle cx="3" cy="9" r="1.7"/><circle cx="9" cy="9" r="1.7"/><circle cx="15" cy="9" r="1.7"/></svg></button>

<div class="times"><span>0:01:12</span><span>−20:48</span></div>
<div class="scrub"><i class="intro"></i><i class="credits"></i><i class="played"></i></div>
</body></html>
